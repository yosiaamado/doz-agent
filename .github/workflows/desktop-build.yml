name: desktop-build

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'plugins/**'
      - '.github/workflows/desktop-build.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win nsis
            artifact_glob: studio/dist-electron/*.exe
          # Menyusul (tanpa mengubah langkah lain): macOS .dmg
          # - os: macos-latest
          #   builder_args: --mac dmg
          #   artifact_glob: studio/dist-electron/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # v1 tanpa code signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run build:web
      - name: Build installer
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
      - name: Checksum
        shell: bash
        run: cd dist-electron && sha256sum *.exe *.dmg 2>/dev/null | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doz-studio-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_glob }}
            studio/dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
